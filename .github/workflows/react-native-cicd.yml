name: React Native Local EAS Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (development/preview/production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Target Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android

jobs:
  build:
    name: Build App Locally on Runner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build local binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CLOUD_PROVIDER: google
          ROBOFLOW_CURRENCY_MODEL: indian-currency
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          npx eas-cli build --platform android --profile $PROFILE --local --non-interactive --output="./build-output/app-$PROFILE"

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.event.inputs.profile || 'preview' }}
          path: ./build-output/
